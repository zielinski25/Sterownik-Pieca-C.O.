; ============================================================================
; PLATFORMIO.INI — Wyswietlacz CO (druga plytka: ESP32 + 3,5" SPI TFT dotykowy)
; ============================================================================
; Ta plytka jest CIENKIM KLIENTEM: nie steruje niczym bezposrednio, tylko
; odpytuje centrale (main.cpp z pierwszego projektu, "Piec CO") po HTTP/WiFi
; i wyswietla/edytuje jej stan przez /api/status, /api/ustawienia-get,
; /api/ustawienia-set, /api/servo-manual.
;
; WAZNE — TFT_eSPI wymaga wlasnego pliku konfiguracyjnego z PINAMI:
;   1. Po pierwszym "pio run" znajdz bibliteke w:
;      .pio/libdeps/<env>/TFT_eSPI/
;   2. Skopiuj plik User_Setup.h z tego projektu (patrz include/User_Setup.h
;      obok tego pliku) NAD plik User_Setup.h w bibliotece — albo (lepsze
;      rozwiazanie, patrz komentarz w include/User_Setup.h) dodaj do
;      build_flags ponizej: -DUSER_SETUP_LOADED=1 -DUSER_SETUP_ID=... i
;      wskaz na plik w tym repo, tak zeby nie edytowac kopii biblioteki
;      recznie za kazdym razem po "pio run -t clean".
;
; DOTYK (XPT2046): [FIX-DOTYK-OSOBNA-MAGISTRALA] po diagnostyce, ktora
; wykazala niedzialajacy dotyk na wspoldzielonej magistrali SPI z ekranem,
; dotyk jest teraz obslugiwany WLASNYM sterownikiem (bitbang) na CALKOWICIE
; OSOBNYCH pinach, zdefiniowanych bezposrednio w main.cpp (nie tutaj):
;   TOUCH_SCK=25  TOUCH_MOSI=26  TOUCH_MISO=33  TOUCH_CS=27
; Dlatego ponizej NIE MA juz -DTOUCH_CS ani -DSPI_TOUCH_FREQUENCY — TFT_eSPI
; nie zarzadza juz dotykiem w tym projekcie.
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev            ; podmien na swoja plytke (np. esp32-s3-devkitc-1)
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; --- konfiguracja TFT_eSPI przez build_flags, bez edycji biblioteki ---
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER          ; podmien na swoj sterownik jesli inny (np. ST7796_DRIVER)
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15               ; chip select ekranu
    -DTFT_DC=2                ; data/command
    -DTFT_RST=4               ; reset (albo -1 i podlacz RST plytki do EN)
    -DTFT_BL=21               ; [ZMIANA, ta sesja] podswietlenie (LED) przez GPIO21 (bylo GPIO32) -
                              ; PRZEZ REZYSTOR ~100-220R, nie na styk. GPIO21 celowo wybrany zamiast
                              ; GPIO32, bo NIE nalezy do rodziny RTC GPIO (GPIO32=RTC_GPIO9) - dzieki
                              ; temu trzymanie stanu pinu w deep sleep obsluguje prosty, uniwersalny
                              ; gpio_hold_en()+gpio_deep_sleep_hold_en() (patrz idzSpac()/setup() w
                              ; main.cpp), bez koniecznosci uzywania rtc_gpio_hold_en() i bez ryzyka
                              ; trafienia na wersyjny bug rdzenia arduino-esp32 dotyczacy akurat
                              ; pinow RTC (GPIO33) przy przetrzymywaniu stanu przez deep sleep.
    -DTFT_BACKLIGHT_ON=HIGH   ; TFT_eSPI wlaczy podswietlenie automatycznie w tft.init()
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DLV_CONF_INCLUDE_SIMPLE  ; [LVGL - KROK 4] mowi bibliotece LVGL zeby szukala lv_conf.h w include/ tego projektu (a nie w swoim wlasnym katalogu)
    -Iinclude                 ; [FIX] jawna sciezka do include/ - zabezpieczenie na wypadek gdyby domyslne wykrywanie PlatformIO tego nie zlapalo (blad "lv_conf.h: No such file")

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.2.0
    lvgl/lvgl @ ^8.3.11     ; [LVGL - KROK 4] PIN na 8.x - v9 ma inne API, nie mieszaj

; [LVGL - KROK 4] Domyslny partition table (~1.3MB app) jest za ciasny gdy
; dojdzie LVGL do istniejacego WiFi+HTTPClient+ArduinoJson+TFT_eSPI. huge_app
; daje ~3MB app kosztem OTA (nie masz OTA w tym projekcie, wiec bez straty).
; [AKTUALIZACJA] Zamienione na wlasny partitions.csv (dual-OTA, ota_0/ota_1
; po ~1,97MB kazdy) - patrz Ustalenie #4 w CALOSC_PLAN_OTA_PANEL.md. Plik
; partitions.csv musi lezec w tym samym katalogu co ten platformio.ini.
board_build.partitions = partitions.csv
