name: Publikuj strone TO BE (GitHub Pages)

# Wlacza GitHub Pages i wdraza zawartosc katalogu docs/ jako statyczna strone.
# Dzieki temu modul ma staly, krotki adres mozliwy do wyslania na Telegramie.
on:
  push:
    branches: [arena/f423a839-sterownik-pieca-c-o]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
