# Buduje APK z katalogu `android/` na czystym runnerze Linuksa.
#
# Po co: komputer użytkownika nie ma ustawionego `sdk.dir` (ścieżka zależy od
# maszyny), więc każdy czysty build kończył się „SDK location not found".
# Tutaj SDK jest już na obrazie runnera (`ANDROID_HOME`), a `local.properties`
# tworzymy w locie — nic wrażliwego nie trafia do repo.
#
# UWAGA: APK jest podpisany losowym kluczem debug runnera, więc nie zainstaluje
# się jako aktualizacja nad APK zbudowanym lokalnie — najpierw odinstaluj starą
# aplikację (dane w Firebase zostają, ustawienia lokalne znikną).
name: APK (Android)

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/apk-android.yml"
  workflow_dispatch:

permissions:
  contents: write   # APK wraca do repo jako transport (artefakty runnera sa nieosiagalne z srodowiska agenta)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Wersja i SDK
        working-directory: android
        run: |
          grep -n 'versionCode\|versionName' app/build.gradle.kts
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: assembleDebug
        working-directory: android
        run: |
          # [0.31.82] Bez pipefail kod wyjscia bierze sie z `tee`, wiec nieudany
          # build konczyl sie zielonym krokiem. Domyslny shell runnera to
          # `bash -e` (bez pipefail) - ustawiamy jawnie.
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # [0.31.81] Testy jednostkowe JVM (app/src/test). Wcześniej CI dowodziło
      # tylko, że źródła główne się kompilują — testy nie były uruchamiane wcale.
      # Krok idzie PO assembleDebug (żeby APK powstał także wtedy, gdy padnie test),
      # a PRZED uploadem, więc czerwony test zatrzymuje wydanie.
      - name: testDebugUnitTest
        working-directory: android
        run: |
          # [0.31.82] `set -o pipefail`: bez tego kod wyjscia bierze sie z `tee`
          # i czerwony test konczylby sie zielonym krokiem. To nie kosmetyka —
          # to jedyna roznica miedzy "testy sa bramka" a "testy sie wykonuja".
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee test.log

      - name: Liczba testow z JUnit XML
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          import xml.etree.ElementTree as ET

          total = fail = err = skip = 0
          klasy = []
          pliki = sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml'))
          for p in pliki:
              root = ET.parse(p).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for s in suites:
                  t = int(s.get('tests', 0) or 0)
                  f = int(s.get('failures', 0) or 0)
                  e = int(s.get('errors', 0) or 0)
                  k = int(s.get('skipped', 0) or 0)
                  total += t; fail += f; err += e; skip += k
                  klasy.append((s.get('name', '?'), t, f, e, k))

          src = open('app/build.gradle.kts', encoding='utf-8').read()
          m = re.search(r'versionName\s*=\s*"([^"]+)"', src)
          wersja = m.group(1) if m else '?'

          print(f"PLIKI XML: {len(pliki)}")
          for n, t, f, e, k in klasy:
              print(f"  {n}: {t} (failures {f}, errors {e}, skipped {k})")
          print(f"RAZEM TESTY: {total} (failures {fail}, errors {err}, skipped {skip})")

          raport = ["Sterownik CO - wynik testow jednostkowych z CI",
                    "=" * 52,
                    "",
                    f"Wersja: {wersja}",
                    f"Plikow XML: {len(pliki)}",
                    f"Testow: {total}",
                    f"Nieudanych (failures): {fail}",
                    f"Bledow (errors): {err}",
                    f"Pominietych (skipped): {skip}",
                    "",
                    "Zrodlo: app/build/test-results/testDebugUnitTest/*.xml",
                    "(suma po wszystkich <testsuite> w kazdym pliku)",
                    ""]
          for n, t, f, e, k in klasy:
              raport.append(f"  {n}: {t} (failures {f}, errors {e}, skipped {k})")

          os.makedirs('../android-sync', exist_ok=True)
          cel = '../android-sync/CI-TESTY.txt'
          open(cel, 'w', encoding='utf-8').write("\n".join(raport) + "\n")
          print(f"zapisano: {os.path.abspath(cel)}")

          podsum = os.environ.get('GITHUB_STEP_SUMMARY')
          if podsum:
              with open(podsum, 'a', encoding='utf-8') as fh:
                  fh.write(f"### Testy jednostkowe: {total} (nieudanych: {fail + err}, pominietych: {skip})\n")

          if total == 0:
              print("::error::brak wynikow testow - pliki XML sa puste albo testy sie nie wykonaly")
              sys.exit(1)
          if fail or err:
              print("::error::testy nie przeszly")
              sys.exit(1)
          PY

      - name: Blad - ostatnie linie jako adnotacja
        if: failure()
        working-directory: android
        run: |
          for f in test.log build.log; do
            if [ -f "$f" ]; then
              echo "::error::--- $f ---"
              tail -n 25 "$f" | while IFS= read -r l; do
                echo "::error::$(printf '%s' "$l" | sed 's/%/%25/g')"
              done
            fi
          done

      - name: APK jako artefakt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SterownikCO-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Artefakty Actions leza na blob.core.windows.net, do ktorego srodowisko
      # agenta nie ma dostepu. Dlatego APK wraca do repo jako plik w commitcie -
      # git idzie po github.com i to jedyny kanal, ktory tu dziala.
      - name: APK do repo (transport dla agenta)
        if: success()
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          mkdir -p android-sync/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "android-sync/apk/SterownikCO-${V}-debug.apk"
          ls -l android-sync/apk
          git config user.name "Arena CI"
          git config user.email "ci@users.noreply.github.com"
          # [0.31.82] Liczba testow jedzie do repo razem z APK - to jedyny kanal,
          # ktorym agent odczyta wynik (logi runow sa niedostepne).
          git add android-sync/apk android-sync/CI-TESTY.txt
          git commit -m "CI: APK ${V} (debug) + wynik testow, zbudowane z android/ na runnerze"
          git push
