org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# [KT-72530] Kotlin Gradle Plugin 2.0.x potrafi wypisac FALSZYWY blad przy starcie demona kompilatora:
#   "The daemon has terminated unexpectedly on startup attempt #1 with error code: 0.
#    The daemon process output: 1. Kotlin compile daemon is ready"
# Kompilacja i tak sie udaje (Gradle idzie dalej, APK powstaje i sie instaluje), ale Build Output
# w Android Studio swieci na czerwono. Kompilacja wewnatrz procesu Gradle (bez osobnego demona
# Kotlina) eliminuje ten komunikat; dla projektu tej wielkosci nie ma roznicy w czasie budowania.
kotlin.compiler.execution.strategy=in-process
