; ============================================================================
; CENTRALA TESTOWA (SYMULATOR) NA ESP32-C3 — PlatformIO
; ============================================================================
; To NIE jest firmware produkcyjny i NIE jest portem main_centrala.cpp.
; To zastepnik centrali: wystawia ten sam kontrakt HTTP, ktory czyta panel LCD,
; a pod spodem ma symulacje (patrz src/symulacja.cpp).
;
; Plytka: dowolny ESP32-C3 z 4 MB flash — ESP32-C3-DevKitM-1, C3 SuperMini,
; ESP32-C3-WROOM-02 itd. Ten firmware NIE UZYWA ZADNYCH GPIO, wiec roznice w
; wyprowadzeniach miedzy plytkami nie maja znaczenia (nic nie trzeba lutowac).
;
; Wersja platformy jest PRZYPIETA (jak w platformio.ini prawdziwej centrali,
; komentarz [FIX 13]): bez przypiecia PlatformIO dobiera "aktualna" wersje przy
; kazdym odswiezeniu cache, co konczy sie roznymi wersjami rdzenia Arduino
; miedzy maszynami i "u mnie dzialalo" przy diagnozie.
; ============================================================================

[env:esp32-c3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1        ; C3 SuperMini / WROOM-02: ta sama definicja (4 MB flash)
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Partycje domyslne (app ~1,2 MB + SPIFFS) — firmware ma ~750 KB razem z
; panelem WWW (HTML siedzi w flash jako const, nie w RAM).
board_build.partitions = default.csv
board_build.flash_size = 4MB

build_flags =
    ; 0 = bez logow debug z rdzenia (na C3 kazdy KB flash i RAM sie liczy);
    ; nasze wlasne komunikaty Serial.printf dzialaja niezaleznie od tego.
    -DCORE_DEBUG_LEVEL=0
    -Os

; Zero zewnetrznych bibliotek: WiFi + Preferences + time.h z rdzenia Arduino.
; (Prawdziwa centrala ma 9 zaleznosci, m.in. FirebaseClient i
; ESPAsyncWebServer — to jeden z powodow, dla ktorych nie wejdzie na C3.)
lib_deps =

; Tylko src/ — testy_host/ to testy na PC (g++), nie kompiluja sie na plytke.
build_src_filter = +<*>
