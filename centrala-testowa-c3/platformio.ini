; ============================================================================
; CENTRALA TESTOWA (SYMULATOR) — PlatformIO
; ============================================================================
; To NIE jest firmware produkcyjny i NIE jest portem main_centrala.cpp.
; To zastepnik centrali: wystawia ten sam kontrakt HTTP, ktory czyta panel LCD,
; a pod spodem ma symulacje (patrz src/symulacja.cpp).
;
; TRZY SRODOWISKA (ten sam kod, zero roznic — firmware nie uzywa ZADNYCH GPIO):
;   esp32     <- DOMYSLNE: klasyczny ESP32 (WROOM-32 / DevKit V1 / ESP32-D0WD)
;   esp32-c3  <- C3 SuperMini / DevKitM-1 / WROOM-02
;   esp32s3   <- ESP32-S3 (DevKitC-1 / S3 Mini), gdy trafi sie taka plytka
;
;   Ktore env pasuje do plytki w reku, rozstrzyga jedna komenda (szczegoly README 3b):
;   pio pkg exec --package platformio/tool-esptoolpy -- esptool.py --port COM5 chip_id
;
;   pio run -t upload              # = esp32 (domyslne)
;   pio run -e esp32-c3 -t upload  # C3               ("Chip is ESP32-C3...")
;   pio run -e esp32s3 -t upload   # ESP32-S3         ("Chip is ESP32-S3...")
;
; Wersja platformy jest PRZYPIETA (jak w platformio.ini prawdziwej centrali,
; komentarz [FIX 13]): bez przypiecia PlatformIO dobiera "aktualna" wersje przy
; kazdym odswiezeniu cache, co konczy sie roznymi wersjami rdzenia Arduino
; miedzy maszynami i "u mnie dzialalo" przy diagnozie.
; ============================================================================

[platformio]
; Bez tego przy kilku srodowiskach `pio run -t upload` bez -e konczy sie
; komunikatem "Please specify environment".
;
; DOMYSLNE = esp32 (klasyczny ESP32) — bo to plytka, ktora jest realnie pod USB
; (chip_id: ESP32-D0WD-V3). Dzieki temu dziala tez przycisk "Upload" w VS Code
; i skrot Ctrl+Alt+U, ktore NIE przekazuja -e: biora default_envs.
; Na C3: `pio run -e esp32-c3 -t upload` (albo zmien te linie z powrotem).
default_envs = esp32

; ---------------------------------------------------------------------------
; Wspolne dla obu plytek
; ---------------------------------------------------------------------------
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Partycje domyslne (app ~1,2 MB + SPIFFS) — firmware ma ~790 KB razem z
; panelem WWW (HTML siedzi w flash jako const, nie w RAM).
board_build.partitions = default.csv

build_flags =
    ; 0 = bez logow debug z rdzenia (kazdy KB flash i RAM sie liczy);
    ; nasze wlasne komunikaty Serial.printf dzialaja niezaleznie od tego.
    -DCORE_DEBUG_LEVEL=0
    -Os

; Predkosc uploadu: 460800 jest OK dla wiekszosci CH340/CP210x. Klony CH340 i
; dlugie kable potrafia jednak nie wyrabiac — przy bledach typu
; "PermissionError(13, 'Odmowa dostepu')" / "Failed to connect" zejdz do 115200:
; upload_speed = 115200

; Zero zewnetrznych bibliotek: WiFi + Preferences + time.h z rdzenia Arduino.
; (Prawdziwa centrala ma 9 zaleznosci, m.in. FirebaseClient i
; ESPAsyncWebServer — to jeden z powodow, dla ktorych nie wejdzie na C3.)
lib_deps =

; Tylko src/ — testy_host/ to testy na PC (g++), nie kompiluja sie na plytke.
build_src_filter = +<*>

; ---------------------------------------------------------------------------
; ESP32-C3 (4 MB flash, brak PSRAM — i to wystarcza, bo dane sa symulowane,
; a nie trzymane w buforach PSRAM jak w prawdziwej centrali)
; ---------------------------------------------------------------------------
[env:esp32-c3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1        ; C3 SuperMini / WROOM-02: ta sama definicja (4 MB flash)
board_build.flash_size = 4MB

; --- PORT (Windows) ---------------------------------------------------------
; PlatformIO domyslnie bierze "pierwszy lepszy" port COM ("Auto-detected: COM5").
; Jesli na biurku wisi tez panel LCD (ESP32, env "esp32dev"), upload konczy sie:
;     A fatal error occurred: This chip is ESP32 not ESP32-C3. Wrong --chip argument?
; Wtedy wpisz port C3 NA SZTYWNO ponizej. Ktory to port, podpowie skrypt:
;     powershell -ExecutionPolicy Bypass -File narzedzia\znajdz_port.ps1 -ChipId
;
; upload_port = COM7
; monitor_port = COM7

; ---------------------------------------------------------------------------
; DOMYSLNE: klasyczny ESP32 (WROOM-32, 4 MB flash, 520 KB RAM).
; Ten sam symulator — tyle ze to wlasnie ta plytka jest pod USB (ESP32-D0WD-V3).
; Uwaga: NIE wgrywaj tego na plytke panelu LCD — skasujesz firmware panelu.
; ---------------------------------------------------------------------------
[env:esp32]
platform = espressif32 @ 6.9.0
board = esp32dev
board_build.flash_size = 4MB

; upload_port = COM7
; monitor_port = COM7

; ---------------------------------------------------------------------------
; OPCJA: ESP32-S3 (DevKitC-1 / S3 Mini).
; Ten sam symulator, ten sam kod zrodlowy — S3 nie jest do niczego potrzebny
; (firmware nie uzywa PSRAM ani drugiego rdzenia), ale jesli pod reka jest
; wlasnie S3, nie ma sensu szukac C3.
; ---------------------------------------------------------------------------
[env:esp32s3]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
; 4 MB nawet na plytce z 8 MB: default.csv (1,2 MB app + 1,5 MB SPIFFS)
; miesci sie w 4 MB, a mniejsza deklaracja nie wywala uploadu na N4/N8.
board_build.flash_size = 4MB

; upload_port = COM7
; monitor_port = COM7
